name: Build market relay

on:
  push:
    branches: ["main"]
    paths:
      - "market-relay/**"
      - "tools/microstructure-core.mjs"
      - "tools/microstructure-signal.mjs"
      - "tools/yahoo-shadow-wave-core.mjs"
      - "tools/l2-event-signal.mjs"
      - "tools/test-l2-event-signal.mjs"
      - "orcl-l2-model.json"
      - "Dockerfile.market-relay"
      - ".github/workflows/market-relay-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check market-relay/server.mjs
          node --check tools/microstructure-core.mjs
          node --check tools/microstructure-signal.mjs
          node --check tools/yahoo-shadow-wave-core.mjs
          node --check tools/l2-event-signal.mjs
          node --check tools/test-l2-event-signal.mjs
          node tools/test-l2-event-signal.mjs
      - name: Build relay image
        run: docker build -f Dockerfile.market-relay -t alantu-market-relay:test .
      - name: Health smoke test without credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name alantu-market-relay-test -p 18080:8080 alantu-market-relay:test
          trap 'docker stop alantu-market-relay-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/health > /tmp/health.json; then break; fi
            sleep 1
          done
          jq -e '.ok==true and .provider=="yahoo" and .feed=="streamer" and .primary_runtime=="yahoo-shadow-wave"' /tmp/health.json >/dev/null
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable and latest images
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alantu-market-relay"
          docker tag alantu-market-relay:test "$image:${GITHUB_SHA}"
          docker tag alantu-market-relay:test "$image:latest"
          docker push "$image:${GITHUB_SHA}"
          docker push "$image:latest"
