name: Find FI-2010 event horizon

on:
  push:
    branches: ["main"]
    paths:
      - "tools/find-fi2010-event-horizon.py"
      - ".github/workflows/fi2010-horizon-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned FI-2010
        run: |
          curl -fL --retry 4 --connect-timeout 15 --max-time 300             'https://raw.githubusercontent.com/zcakhaa/DeepLOB-Deep-Convolutional-Neural-Networks-for-Limit-Order-Books/ff14d7c2fd38bdfc143389786993d0f0236d4eb8/data/data.zip'             -o /tmp/fi2010.zip
          test "$(git hash-object /tmp/fi2010.zip)" = '2d8d7749caf622dd07e0df954413dc698129c766'
          mkdir -p /tmp/fi2010 && unzip -q /tmp/fi2010.zip -d /tmp/fi2010
      - run: python -m pip install --disable-pip-version-check --quiet numpy
      - name: Sweep event horizons on development data only
        run: python tools/find-fi2010-event-horizon.py /tmp/fi2010 fi2010-horizon-sweep.json
      - uses: actions/upload-artifact@v4
        with:
          name: fi2010-horizon-sweep-${{ github.run_id }}
          path: fi2010-horizon-sweep.json
          retention-days: 90
