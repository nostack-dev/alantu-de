name: Prove microstructure OOS

on:
  push:
    branches: ["main"]
    paths:
      - "tools/validate-fi2010-microstructure.py"
      - ".github/workflows/fi2010-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public FI-2010 benchmark
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --connect-timeout 15 --max-time 300             'https://raw.githubusercontent.com/zcakhaa/DeepLOB-Deep-Convolutional-Neural-Networks-for-Limit-Order-Books/master/data/data.zip'             -o /tmp/fi2010.zip
          mkdir -p /tmp/fi2010
          unzip -q /tmp/fi2010.zip -d /tmp/fi2010
          find /tmp/fi2010 -type f -name '*DecPre*' -printf '%f %s bytes\n' | sort
      - name: Install numeric runtime
        run: python -m pip install --disable-pip-version-check --quiet numpy
      - name: Train 7 days, hold out last 3 days
        run: python tools/validate-fi2010-microstructure.py /tmp/fi2010 fi2010-microstructure-proof.json
      - name: Verify proof contract
        run: |
          jq -e '.dataset=="FI-2010 NoAuction DecPre" and (.test_days|type=="array") and (.horizons["10"].holdout.n>0)' fi2010-microstructure-proof.json >/dev/null
      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: fi2010-microstructure-proof-${{ github.run_id }}
          path: fi2010-microstructure-proof.json
          retention-days: 90
