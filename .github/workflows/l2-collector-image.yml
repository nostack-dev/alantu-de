name: Build L2 collector

on:
  push:
    branches: ["main"]
    paths:
      - "tools/databento-orcl-mbp10-live.py"
      - "Dockerfile.l2-collector"
      - ".github/workflows/l2-collector-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python -m py_compile tools/databento-orcl-mbp10-live.py
      - name: Build collector image
        run: docker build -f Dockerfile.l2-collector -t alantu-l2-collector:test .
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable and latest images
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alantu-l2-collector"
          docker tag alantu-l2-collector:test "$image:${GITHUB_SHA}"
          docker tag alantu-l2-collector:test "$image:latest"
          docker push "$image:${GITHUB_SHA}"
          docker push "$image:latest"
