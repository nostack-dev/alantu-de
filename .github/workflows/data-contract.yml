name: Market data contract

on:
  push:
    branches: [main]
    paths:
      - 'tools/yahoo-monetary-v5.mjs'
      - 'market-clock-core.js'
      - 'tools/test-market-clock.mjs'
      - 'tools/yahoo-stream-contract.mjs'
      - 'tools/test-yahoo-stream-contract.mjs'
      - 'market-relay/server.mjs'
      - 'market-relay/sqlite-store.mjs'
      - 'market-relay/package.json'
      - 'tools/test-sqlite-v6.mjs'
      - 'tools/test-sqlite-store.mjs'
      - 'tools/test-data-contract.mjs'
      - '.github/workflows/data-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: First-principles data invariants
        run: |
          node tools/test-data-contract.mjs
          node tools/test-yahoo-stream-contract.mjs
          node tools/test-market-clock.mjs
          cd market-relay && npm install --ignore-scripts=false && cd ..
          node tools/test-sqlite-v6.mjs
      - name: SQLite audit-store invariants
        run: node tools/test-sqlite-store.mjs
      - name: Static anti-leakage guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "clock:'market_event_time'" tools/yahoo-monetary-v5.mjs
          grep -Fq "evaluation_contract:'market_event_time_true_dt_no_synthetic_samples_v3'" market-relay/server.mjs
          grep -Fq "reason:'out_of_order'" tools/yahoo-stream-contract.mjs
          grep -Fq "reason:'duplicate_market_timestamp'" tools/yahoo-stream-contract.mjs
          grep -Fq "persistTransportObservation" market-relay/server.mjs
          grep -Fq "YAHOO_EVENT_CONTRACT" market-relay/server.mjs
          grep -Fq "zigZag64(v)" market-relay/server.mjs
          grep -Fq "entry_market_ms:marketAt" market-relay/server.mjs
          grep -Fq "if(already)return;" market-relay/server.mjs
          grep -Fq "feature_names:state.feature_names" market-relay/server.mjs
          grep -Fq "persistEvidence(marketDb" market-relay/server.mjs
          grep -Fq "prev_market_at_ms" market-relay/sqlite-store.mjs
          grep -Fq "delta_t_ms" market-relay/sqlite-store.mjs
          grep -Fq "learned_net_bps" market-relay/sqlite-store.mjs
          grep -Fq "/v1/research-v6" market-relay/server.mjs
