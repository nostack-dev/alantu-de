name: Hotfix UOCR stability

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hotfix-uocr-stability.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch runtime
        run: |
          set -euo pipefail
          node tools/patch-uocr-stability.cjs
          node --check alantu-unlimited-ocr.js
          grep -q 'function fetchWithRetry' alantu-unlimited-ocr.js
          grep -q 'diagnoseLocalOcrBottleneck' alantu-unlimited-ocr.js
          grep -q 'runSmallFallbackOcr' alantu-unlimited-ocr.js
          grep -q 'Fallback-OCR auf' alantu-unlimited-ocr.js
          grep -q 'browser-webgpu-6' pdf-convert-anchor.html
      - name: Commit cascade
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alantu-unlimited-ocr.js pdf-convert-anchor.html
          git commit -m "Add OCR fallback cascade" || exit 0
          git push