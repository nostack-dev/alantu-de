name: Build market runtime

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile.market-runtime"
      - "market-runtime/**"
      - "railway.json"
      - "market-relay/server.mjs"
      - "tools/microstructure-core.mjs"
      - "tools/microstructure-signal.mjs"
      - "tools/yahoo-shadow-wave-core.mjs"
      - "tools/l2-event-signal.mjs"
      - "tools/databento-orcl-mbp10-live.py"
      - "orcl-l2-model.json"
      - ".github/workflows/market-runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check market-relay/server.mjs
          node --check tools/microstructure-core.mjs
          node --check tools/microstructure-signal.mjs
          node --check tools/yahoo-shadow-wave-core.mjs
          node --check tools/l2-event-signal.mjs
          python -m py_compile tools/databento-orcl-mbp10-live.py
      - name: Build
        run: docker build -f Dockerfile.market-runtime -t alantu-market-runtime:test .
      - name: Smoke test runtime relay
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm -p 18080:8080 alantu-market-runtime:test)"
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/health -o /tmp/health.json; then break; fi
            sleep .25
          done
          jq -e '.ok==true and (.provider=="yahoo" or .provider=="alpaca") and (.primary_runtime=="yahoo-shadow-wave" or .primary_runtime=="raw-sip-wave")' /tmp/health.json >/dev/null
          curl -fsS http://127.0.0.1:18080/v1/source-state -o /tmp/source-state.json
          jq -e 'has("status") and has("coverage") and has("providers") and has("items") and has("checked_at") and has("at") and .event_mode=="new_since_last_poll" and (.poll_interval_seconds<=20) and (.max_live_delay_seconds<=90) and (.market_match_tolerance_seconds<=60) and has("live_count") and has("new_count") and has("delayed_count") and has("archive_count") and has("source_counts") and has("archive_source_counts")' /tmp/source-state.json >/dev/null
          curl -fsS http://127.0.0.1:18080/v1/shadow-history -o /tmp/shadow-history.json
          jq -e 'has("version") and (.proof|type=="object") and (.pending|type=="array") and (.outcomes|type=="array")' /tmp/shadow-history.json >/dev/null
          curl -fsS 'http://127.0.0.1:18080/v1/snapshot?symbol=ORCL' -o /tmp/snapshot.json
          jq -e '.symbol=="ORCL" and (.provider=="yahoo" or .provider=="alpaca")' /tmp/snapshot.json >/dev/null
          set +e
          curl -sS -N --max-time 3 'http://127.0.0.1:18080/v1/stream?symbol=ORCL' -o /tmp/stream.txt
          rc=$?
          set -e
          test "$rc" -eq 0 || test "$rc" -eq 28
          grep -q '^event: sources' /tmp/stream.txt
          grep -q '^event: shadow' /tmp/stream.txt
          grep -q '^event: market' /tmp/stream.txt
          docker inspect -f '{{.State.Running}}' "$cid" | grep -qx true
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alantu-market-runtime"
          docker tag alantu-market-runtime:test "$image:${GITHUB_SHA}"
          docker tag alantu-market-runtime:test "$image:latest"
          docker push "$image:${GITHUB_SHA}"
          docker push "$image:latest"
