name: Adaptive OCR real browser smoke

on:
  push:
    branches: ["main"]
    paths:
      - "alantu-unlimited-ocr.js"
      - "pdf-convert-anchor.html"
      - "vendor/unlimited-ocr-browser-engine.js"
      - ".github/workflows/uocr-real-browser-smoke.yml"
      - "tools/uocr-real-browser-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-uocr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for live runtime revision
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -fsSL --max-time 20 "https://www.alantu.de/pdf-convert-anchor.html?real=${{ github.sha }}" -o /tmp/page.html \
              && curl -fsSL --max-time 20 "https://www.alantu.de/alantu-unlimited-ocr.js?real=${{ github.sha }}" -o /tmp/uocr.js \
              && curl -fsSL --max-time 20 "https://www.alantu.de/vendor/unlimited-ocr-browser-engine.js?real=${{ github.sha }}" -o /tmp/engine.js \
              && grep -q 'alantu-unlimited-ocr.js?v=browser-webgpu-14' /tmp/page.html \
              && grep -q 'decoderTransport:"HTTP Range → GPU buffers"' /tmp/uocr.js \
              && grep -q 'FALLBACK_LONG_EDGE=1600' /tmp/uocr.js \
              && grep -q 'primaryOcrDisabledReason' /tmp/uocr.js \
              && grep -q 'from "./vendor/unlimited-ocr-browser-engine.js"' /tmp/uocr.js \
              && grep -q 'Unlimited-OCR-DeepEncoder-ONNX' /tmp/uocr.js \
              && grep -q 'PROMPT_IDS=\[34030,76466,16\]' /tmp/uocr.js \
              && grep -q 'beginRingDecode(pos+1)' /tmp/uocr.js \
              && grep -q 'runSmallFallbackOcr' /tmp/uocr.js \
              && grep -q 'buildVectorPdf' /tmp/uocr.js \
              && grep -q 'renderVectorSvgLayer' /tmp/uocr.js \
              && grep -q 'createGemmaEngine' /tmp/engine.js \
              && ! grep -q '@wllama/wllama' /tmp/uocr.js; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Run real adaptive OCR and vectorization in browser
        env:
          PDF_CONVERT_URL: https://www.alantu.de/pdf-convert-anchor.html
        run: node tools/uocr-real-browser-smoke.mjs
