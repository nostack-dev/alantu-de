name: Persist raw SIP model

on:
  schedule:
    - cron: "7,37 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persist-raw-sip-model
  cancel-in-progress: true

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch trained model from Railway
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 30             https://alantu-market-production.up.railway.app/v1/raw-wave-model             -o /tmp/orcl-raw-sip-model.json

          jq -e '
            .provider=="alpaca" and
            .feed=="sip" and
            .input_contract=="raw_sip_trades_quotes_no_bar_aggregation" and
            .feature_version=="raw-sip-hdr-dt-v1" and
            (.model_id|type=="string" and length>0) and
            (.usable_days >= 200) and
            ([.horizons[].horizon_minutes]|sort)==[1,5,15,30] and
            (.status=="validated" or .status=="unproven")
          ' /tmp/orcl-raw-sip-model.json >/dev/null

      - name: Persist only complete trained result
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/orcl-raw-sip-model.json orcl-raw-sip-model.json
          git add orcl-raw-sip-model.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "raw-sip-model-sync"
          git config user.email "raw-sip-model-sync@users.noreply.github.com"
          git commit -m "Persist trained ORCL raw SIP model"
          git push origin HEAD:main
