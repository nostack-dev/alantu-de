name: Exposee live smoke

on:
  push:
    branches: [main]
    paths:
      - index-brand.html
      - pdf-to-exposee.html
      - alantu-book-view.js
      - alantu-book-core.js
      - tools/exposee-browser-smoke.mjs
      - .github/workflows/exposee-browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  exposee-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check viewer sources and sample PDF
        run: |
          test -s assets/sunside-living-expose.pdf
          grep -q 'view404' index-brand.html
          grep -q 'view404' pdf-to-exposee.html
          grep -q 'brand308' index-brand.html
          grep -q 'brand308' pdf-to-exposee.html
          grep -q 'spreadFocusTarget' alantu-book-view.js
      - name: Wait for deployed viewers
        shell: bash
        run: |
          set -euo pipefail
          for path in index-brand.html pdf-to-exposee.html alantu-book-view.js alantu-book-core.js; do
            ready=0
            for attempt in $(seq 1 36); do
              if curl -fsSL --max-time 20 "https://www.alantu.de/$path?smoke=${{ github.sha }}" -o /tmp/alantu-live-file; then
                if { [ "$path" = alantu-book-core.js ] && grep -q 'captured:false' /tmp/alantu-live-file; } || \
                   { [ "$path" = alantu-book-view.js ] && grep -q 'spreadFocusTarget' /tmp/alantu-live-file; } || \
                   { grep -q 'view404' /tmp/alantu-live-file && grep -q 'brand308' /tmp/alantu-live-file; }; then
                  ready=1
                  break
                fi
              fi
              sleep 10
            done
            [ "$ready" = 1 ] || { echo "$path has not deployed" >&2; exit 1; }
          done
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect desktop and mobile book rendering
        env:
          SMOKE_OUT: /tmp/alantu-exposee-smoke
        run: node tools/exposee-browser-smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alantu-exposee-browser-smoke
          path: |
            /tmp/alantu-exposee-smoke/*.png
            /tmp/alantu-exposee-smoke/*.webm
          if-no-files-found: ignore
      - name: Publish smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; else state=failure; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"exposee-live-smoke\",\"description\":\"Desktop/mobile book render and screenshots\"}"
