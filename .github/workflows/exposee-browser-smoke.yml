name: Exposee live smoke

on:
  push:
    branches: ["main"]
    paths:
      - "index-brand.html"
      - "pdf-to-exposee.html"
      - "alantu-book-view.js"
      - "alantu-book-core.js"
      - "assets/sunside-living-expose.pdf"
      - "tools/exposee-browser-smoke.mjs"
      - ".github/workflows/exposee-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  exposee-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Mark live smoke pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/statuses/$SHA \
            -d '{"state":"pending","context":"exposee-live-smoke","description":"Checking live Exposee viewers"}'

      - name: Guard shared renderer, source PDF, and aspect-ratio invariants
        shell: bash
        run: |
          set -euo pipefail

          # Landing consumes the builder renderer instead of a second renderer.
          grep -q 'id="exposeeFrame"' index-brand.html
          grep -q 'pdf-to-exposee.html?embed=1' index-brand.html
          grep -q 'sunside-living-expose.pdf' index-brand.html
          grep -q 'enterDemoFauxFullscreen' index-brand.html
          grep -q 'alantu-fullscreen-toggle' index-brand.html
          ! grep -q 'id="bookCanvas"' index-brand.html
          ! grep -q 'Starnberger See' index-brand.html
          ! grep -q 'PRIVATE RESIDENCE' index-brand.html
          ! grep -q 'function textureFor(index)' index-brand.html

          # Builder owns controls and never stretches X/Y.
          f=pdf-to-exposee.html
          grep -q 'tiltXDegrees=4' "$f"
          grep -q 'tiltYDegrees=2' "$f"
          grep -q 'tiltZDegrees=0' "$f"
          grep -q 'id="zoomLess"' "$f"
          grep -q 'class="axis-controls"' "$f"
          grep -q 'id="debugToggle"' "$f"
          grep -q 'function setDebugControls' "$f"
          grep -q 'alantu-fullscreen-toggle' "$f"
          grep -q 'stage:fullscreen .axis-controls' "$f"
          grep -q 'function hardcoverPageMaterials' "$f"
          grep -q 'frontCoverUsesPdf=true' "$f"
          grep -q 'COVER_SCALE=1.055' "$f"
          grep -q 'async function loadPdfFromUrl' "$f"
          grep -q 'function ivoryHardcoverMaterial' "$f"
          grep -q 'function paperFinishMaterial' "$f"
          grep -q 'new THREE.ShadowMaterial' "$f"
          grep -q 'LinearMipmapLinearFilter' "$f"
          ! grep -Eq 'root\.scale\.(x|y)[[:space:]]*=' "$f"
          ! grep -Eq 'scaleX[[:space:]]*\(' "$f"
          ! grep -Eq 'scaleY[[:space:]]*\(' "$f"

          ! grep -q 'root.rotation.set' alantu-book-view.js
          grep -q 'root.scale.setScalar(scale)' alantu-book-view.js

          test -s assets/sunside-living-expose.pdf
          file assets/sunside-living-expose.pdf | grep -qi PDF
      - name: Wait for current landing, builder, and brochure asset
        shell: bash
        run: |
          set -euo pipefail

          wait_for () {
            local url="$1"
            local out="$2"
            shift 2
            for i in $(seq 1 36); do
              if curl -fsSL --max-time 20 "$url" -o "$out"; then
                local ok=1
                for needle in "$@"; do
                  grep -q "$needle" "$out" || ok=0
                done
                if [ "$ok" = 1 ]; then return 0; fi
              fi
              sleep 10
            done
            echo "Live content did not reach current main: $url" >&2
            return 1
          }

          wait_for "https://www.alantu.de/index-brand.html?smoke=${{ github.sha }}" /tmp/index-brand-live.html \
            'id="exposeeFrame"' 'pdf-to-exposee.html?embed=1' 'sunside-living-expose.pdf' \
            'enterDemoFauxFullscreen' 'alantu-fullscreen-toggle'

          wait_for "https://www.alantu.de/pdf-to-exposee.html?smoke=${{ github.sha }}" /tmp/pdf-to-exposee-live.html \
            'tiltXDegrees=4' 'tiltYDegrees=2' 'function hardcoverPageMaterials' 'async function loadPdfFromUrl' \
            'id="debugToggle"' 'function setDebugControls' 'alantu-fullscreen-toggle' 'brand309' 'new THREE.ShadowMaterial'

          curl -fsSL --max-time 40 \
            "https://www.alantu.de/assets/sunside-living-expose.pdf?smoke=${{ github.sha }}" \
            -o /tmp/sunside-live.pdf
          test -s /tmp/sunside-live.pdf
          file /tmp/sunside-live.pdf | grep -qi PDF
      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Desktop and mobile Exposee console/render smoke
        env:
          EXPOSEE_URLS: https://www.alantu.de/index-brand.html,https://www.alantu.de/pdf-to-exposee.html?embed=1&pdf=%2Fassets%2Fsunside-living-expose.pdf&brand=Sunside%20Living&title=Konstanz%20Wollmatingen%20Expos%C3%A9&subtitle=Konstanz%20Wollmatingen
          SMOKE_OUT: /tmp/alantu-exposee-smoke
        run: node tools/exposee-browser-smoke.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alantu-exposee-browser-smoke
          path: /tmp/alantu-exposee-smoke/*.png
          if-no-files-found: ignore

      - name: Publish live smoke result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Both Exposee viewers live and console-clean"
          else
            state=failure
            description="Exposee live/browser smoke failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/statuses/$SHA \
            -d "{\"state\":\"$state\",\"context\":\"exposee-live-smoke\",\"description\":\"$description\"}"
