name: Exposee live smoke

on:
  push:
    branches: [main]
    paths:
      - index-brand.html
      - pdf-to-exposee.html
      - alantu-book-view.js
      - alantu-book-core.js
      - tools/exposee-browser-smoke.mjs
      - .github/workflows/exposee-browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  exposee-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check exact restored viewer sources and sample PDF
        run: |
          test -s assets/sunside-living-expose.pdf
          test "$(git hash-object index-brand.html)" = "928125197c12b15d512750ec3cd4cd2f80204fad"
          test "$(git hash-object pdf-to-exposee.html)" = "d1afce002716d84c421746c5f6e6bbac5cc7c2df"
          test "$(git hash-object alantu-book-core.js)" = "d0ccf0a989e998805de61c6954c06131e21e8720"
          test "$(git hash-object alantu-book-view.js)" = "7a72b86e4ea3311d97e9375aff02c8bdae7c67df"
      - name: Wait for deployed viewers
        shell: bash
        run: |
          set -euo pipefail
          expected_hash () {
            case "$1" in
              index-brand.html) echo "928125197c12b15d512750ec3cd4cd2f80204fad" ;;
              pdf-to-exposee.html) echo "d1afce002716d84c421746c5f6e6bbac5cc7c2df" ;;
              alantu-book-core.js) echo "d0ccf0a989e998805de61c6954c06131e21e8720" ;;
              alantu-book-view.js) echo "7a72b86e4ea3311d97e9375aff02c8bdae7c67df" ;;
              *) return 1 ;;
            esac
          }
          for path in index-brand.html pdf-to-exposee.html alantu-book-view.js alantu-book-core.js; do
            ready=0
            expected="$(expected_hash "$path")"
            for attempt in $(seq 1 36); do
              if curl -fsSL --max-time 20 "https://www.alantu.de/$path?smoke=${{ github.sha }}" -o /tmp/alantu-live-file; then
                if [ "$(git hash-object /tmp/alantu-live-file)" = "$expected" ]; then
                  ready=1
                  break
                fi
              fi
              sleep 10
            done
            [ "$ready" = 1 ] || { echo "$path has not deployed exact restored version" >&2; exit 1; }
          done
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect desktop and mobile book rendering
        env:
          SMOKE_OUT: /tmp/alantu-exposee-smoke
        run: node tools/exposee-browser-smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alantu-exposee-browser-smoke
          path: |
            /tmp/alantu-exposee-smoke/*.png
            /tmp/alantu-exposee-smoke/*.webm
          if-no-files-found: ignore
      - name: Publish smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; else state=failure; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"exposee-live-smoke\",\"description\":\"Desktop/mobile book render and screenshots\"}"
