name: Exposee live smoke

on:
  push:
    branches: [main]
    paths:
      - index-brand.html
      - pdf-to-exposee.html
      - alantu-book-view.js
      - alantu-book-core.js
      - tools/exposee-browser-smoke.mjs
      - .github/workflows/exposee-browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  exposee-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check pre-PDF renderer with targeted hotfixes
        run: |
          set -euo pipefail
          test -s assets/sunside-living-expose.pdf
          grep -q 'prepdf-fix1' index-brand.html
          grep -q 'prepdf-fix1' pdf-to-exposee.html
          grep -q 'SUNSIDE LIVING' index-brand.html
          grep -q 'Kindlebildstraße 13 + 13a' index-brand.html
          ! grep -q 'Starnberger See · Bayern' index-brand.html
          ! grep -q 'PRIVATE RESIDENCE' index-brand.html
          grep -q 'function centerSpreadGeometry' alantu-book-view.js
          grep -q 'subtitleSize' alantu-book-core.js
          ! grep -q 'id="exposeeFrame"' index-brand.html
      - name: Wait for deployed viewers
        shell: bash
        run: |
          set -euo pipefail
          wait_for () {
            local path="$1"
            shift
            for attempt in $(seq 1 36); do
              if curl -fsSL --max-time 20 "https://www.alantu.de/$path?smoke=${{ github.sha }}" -o /tmp/alantu-live-file; then
                local ok=1
                for needle in "$@"; do
                  grep -q "$needle" /tmp/alantu-live-file || ok=0
                done
                if [ "$ok" = 1 ]; then return 0; fi
              fi
              sleep 10
            done
            echo "$path has not deployed current pre-PDF hotfix" >&2
            return 1
          }
          wait_for index-brand.html 'prepdf-fix1' 'SUNSIDE LIVING' 'Kindlebildstraße 13 + 13a'
          wait_for pdf-to-exposee.html 'prepdf-fix1'
          wait_for alantu-book-view.js 'function centerSpreadGeometry'
          wait_for alantu-book-core.js 'subtitleSize'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect desktop and mobile book rendering
        env:
          SMOKE_OUT: /tmp/alantu-exposee-smoke
        run: node tools/exposee-browser-smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alantu-exposee-browser-smoke
          path: |
            /tmp/alantu-exposee-smoke/*.png
            /tmp/alantu-exposee-smoke/*.webm
          if-no-files-found: ignore
      - name: Publish smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; else state=failure; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"exposee-live-smoke\",\"description\":\"Desktop/mobile book render and screenshots\"}"
