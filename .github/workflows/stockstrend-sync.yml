name: Keep ALANTU runtime current

# UI/code source of truth: this repository (alantu-de/main).
# This workflow may refresh runtime JSON only. It must never copy UI/code from kurzlernen-de.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "fresh-sources.json"
      - "stockstrend-data.json"
      - "watchlist-data.json"
      - "watchlist.json"
      - "orcl-minute.json"
      - "orcl-history.json"
      - "orcl-sentiment-history.json"
      - "eurusd-history.json"
      - "runtime-status.json"
      - "microstructure-current.json"
      - "microstructure-status.json"
      - "microstructure-edge-status.json"
      - "microstructure-live-config.json"
      - "orcl-l2-model.json"
      - "orcl-wave-model.json"
      - "wave-model-core.js"
      - "tools/l2-event-signal.mjs"
      - "tools/test-l2-event-signal.mjs"
      - "tools/databento-orcl-mbp10-backfill.py"
      - "tools/databento-orcl-mbp10-live.py"
      - "tools/train-orcl-l2-100.py"
      - "tools/finalize-l2-model.mjs"
      - "Dockerfile.l2-collector"
      - ".github/workflows/orcl-l2-proof.yml"
      - "market-relay/**"
      - "tools/microstructure-core.mjs"
      - "tools/microstructure-signal.mjs"
      - "tools/alpaca-microstructure-backfill.mjs"
      - "tools/alpaca-microstructure-live.mjs"
      - "tools/validate-sip-edge.mjs"
      - "tools/apply-micro-edge.mjs"
      - "Dockerfile.market-relay"
      - ".dockerignore.market-relay"
      - ".github/workflows/microstructure-data.yml"
      - ".github/workflows/microstructure-shadow.yml"
      - ".github/workflows/microstructure-edge.yml"
      - ".github/workflows/market-relay-image.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockstrend-runtime-v2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Refresh ORCL minute and EURUSD fallback feeds
        shell: bash
        run: |
          set -euo pipefail
          fetch_pair() {
            local url1="$1" url2="$2" out="$3"
            if ! curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$url1" -o "$out.tmp"; then
              curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$url2" -o "$out.tmp"
            fi
            test -s "$out.tmp"
            mv "$out.tmp" "$out"
          }

          fetch_pair \
            'https://query1.finance.yahoo.com/v8/finance/chart/ORCL?range=5d&interval=1m&includePrePost=true&events=div%2Csplits' \
            'https://query2.finance.yahoo.com/v8/finance/chart/ORCL?range=5d&interval=1m&includePrePost=true&events=div%2Csplits' \
            orcl-minute.json

          fetch_pair \
            'https://query1.finance.yahoo.com/v8/finance/chart/EURUSD=X?range=10y&interval=1d&includePrePost=false&events=div%2Csplits' \
            'https://query2.finance.yahoo.com/v8/finance/chart/EURUSD=X?range=10y&interval=1d&includePrePost=false&events=div%2Csplits' \
            eurusd-history.json

          fetch_pair \
            'https://query1.finance.yahoo.com/v8/finance/chart/ORCL?range=10y&interval=1d&includePrePost=false&events=div%2Csplits' \
            'https://query2.finance.yahoo.com/v8/finance/chart/ORCL?range=10y&interval=1d&includePrePost=false&events=div%2Csplits' \
            orcl-history.json

      - name: Build fresh fallback signal snapshot
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/refresh-runtime-data.mjs
          node tools/refresh-runtime-data.mjs

      - name: Refresh same-origin source snapshot
        run: node tools/refresh-fresh-sources.mjs

      - name: Fail-closed validation
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'id="livePrice"' index.html
          grep -q 'id="marketClock"' index.html
          grep -q 'id="syncFooter"' index.html
          grep -q "fetchJson('stockstrend-data.json'" index.html
          grep -q "fetchJson('watchlist-data.json'" index.html
          grep -q "fetchJson('intrinsic-orcl.json'" index.html
          grep -q "fetchJson('eurusd-history.json'" index.html
          grep -q "fetch('fresh-sources.json" index.html
          grep -q 'refreshFreshSignals' index.html
          grep -q 'lastBrowserSyncAt=s.at' index.html
          grep -q 'TickerTick ORCL UGC' tools/refresh-fresh-sources.mjs
          grep -q "T:ugc)" tools/refresh-fresh-sources.mjs
          grep -q "E:oracle T:ugc" tools/refresh-fresh-sources.mjs
          grep -q 'minSocial=50' index.html
          grep -q 'id="sentimentRelation"' index.html
          grep -q 'function hdrRelationSeries' index.html
          grep -q 'while(windowStart<i&&cur.t-daily\[windowStart\].t>yearMs)windowStart++' index.html
          grep -q "label:'Struktur'" index.html
          ! grep -q 'public.api.bsky.app' index.html
          ! grep -q 'id="sentiment3dToggle"' index.html
          ! grep -q 'id="hypeChart3d"' index.html
          ! grep -q 'function sentimentReliability' index.html
          grep -q 'function latestBerlinTradingWindow' index.html
          grep -Fq 'var end=Math.min(session.close,Math.max(session.open+60000,ms))' index.html
          grep -q 'function updateLivePriceChart1d' index.html
          grep -q 'id="marketFlow"' index.html
          grep -q 'id="waveForecasts"' index.html
          grep -q 'id="forecastProofStrip"' index.html
          grep -q 'id="forecastRange"' index.html
          grep -q "forecastRange=loadChartRange('forecast','1d')" index.html
          grep -q "setChartRange('forecast'" index.html
          grep -q 'function forecastBuckets' index.html
          grep -q 'function clearChartInteraction' index.html
          ! grep -q 'class="forecast-event' index.html
          grep -q 'id="opinionsRange"' index.html
          grep -q "opinions:'alantu_opinions_range_v1'" index.html
          grep -q "setChartRange('opinions'" index.html
          grep -q "forecast:'alantu_forecast_range_v1'" index.html
          grep -q "setChartRange('forecast'" index.html
          grep -q 'forecast-bin' index.html
          ! grep -q 'forecast-entry' index.html
          ! grep -q 'forecast-result hit' index.html
          grep -q 'Signal → Zielzeit → war die Richtung richtig?' index.html
          grep -q 'function mergeShadowTrail' index.html
          grep -q "shadowTrail(5000,'history')" market-relay/server.mjs
          grep -q "shadowTrail(180,'update')" market-relay/server.mjs
          grep -q 'id="sentimentPanel"' index.html
          grep -q "addEventListener('sources'" index.html
          grep -q 'function railwaySourcesUsable' index.html
          grep -q "function priceSegmentColor(){return '#000000';}" index.html
          grep -q 'function trajectoryDatasets' index.html
          grep -q "addEventListener('shadow'" index.html
          ! grep -q "fetch(base+'/v1/source-state" index.html
          ! grep -q "fetch(base+'/v1/shadow-history" index.html
          grep -q 'trajectoryGuessCloud' index.html
          grep -q 'function guessPathDataset' index.html
          grep -q 'function projectionDispersionBpsAt' index.html
          grep -q "label:'Projektionspfad'" index.html
          ! grep -q "label:'Guess-Cluster'" index.html
          ! grep -q "label:'Gesamtprojektion'" index.html
          grep -q 'function validatedWaveForecast' index.html
          grep -q 'function scheduleWaveForecast' index.html
          grep -q "fetchJson('orcl-raw-sip-model.json',true)" index.html
          grep -Fq "var hs=[1,5,15,30]" index.html
          grep -q "field===9" index.html
          grep -q "f.kind==='wave'" index.html
          grep -q 'function marketWaveVector' index.html
          grep -q "reason:'no_time_aligned_live_sentiment'" index.html
          grep -q 'function hdrImpulseVector' index.html
          grep -q 'function runHdrFreshAsync' index.html
          grep -q 'function microstructureShadowUsable' index.html
          grep -q 'function validatedMicrostructureSignal' index.html
          grep -q 'function validatedL2Forecast' index.html
          grep -q "addEventListener('l2'" index.html
          grep -q "name:'Self'" index.html
          grep -q "name:'Lokal'" index.html
          grep -q "name:'Global'" index.html
          grep -q 'Δt ' index.html
          grep -q 'E2E ' index.html
          grep -q "fetchJson('orcl-l2-model.json',true)" index.html
          grep -q "phase=dir>0?'BUY-POTENZIAL':'SELL-POTENZIAL'" index.html
          grep -q "var phase='NEUTRAL / WARTEN'" index.html
          grep -q 'Number(s.horizon_events)!==100' index.html
          grep -q 'function connectMicrostructureRelay' index.html
          grep -q "fetchJson('microstructure-live-config.json',true)" index.html
          grep -q "cfg.transport!=='sse'" index.html
          grep -q "typeof EventSource==='undefined'" index.html
          grep -q 'streamer.finance.yahoo.com' index.html
          grep -q "fetchJson('microstructure-edge-status.json',true)" index.html
          grep -q "f.kind==='micro'" index.html
          grep -q "if(m.model_id&&s.model_id!==m.model_id)return null" index.html
          grep -q "source:'raw_sip'" index.html
          ! grep -q 'APCA_API_SECRET_KEY' index.html
          ! grep -q 'APCA_API_KEY_ID' index.html
          ! grep -q 'X_BEARER_TOKEN' index.html
          grep -q 'new Worker(url)' index.html
          ! grep -q 'waveCache' index.html
          grep -q 'BERLIN_DAY_FMT' index.html
          ! grep -q "label='Vorimpuls'" index.html
          grep -q 'function flowPointStyle' index.html
          grep -q 'function renderMarketFlowVisual' index.html
          grep -q 'function flowComponentValue' index.html
          grep -q 'class="flow-scale"' index.html
          grep -q 'class="flow-link-layer"' index.html
          grep -q "else if(counter)" index.html
          grep -q "var phase='NEUTRAL / WARTEN'" index.html
          grep -q 'impulse.reliable' index.html
          grep -q "label='Welle baut sich auf'" index.html
          grep -q "label='Welle bestätigt'" index.html
          grep -q "label='Welle dreht'" index.html
          grep -q "label='Welle läuft aus'" index.html
          grep -q 'if(!wave&&evidence<2)' index.html
          grep -q 'lastFlowRenderAt>=15000' index.html
          grep -q 'lastLiveTickPruneAt' index.html
          grep -q 'tickNow-lastLiveTickPruneAt>=15000' index.html
          grep -q 'function priceSegmentColor' index.html
          grep -q "function priceSegmentColor(){return '#000000';}" index.html
          grep -q 'segment:{borderColor:priceSegmentColor}' index.html
          grep -q '!shockNotifyEnabled()||liveShockTimer' index.html
          grep -q 'devicePixelRatio:Math.min(2,window.devicePixelRatio||1)' index.html
          grep -q "priceRange==='1d'?180" index.html
          ! grep -q 'function livePricePace' index.html
          ! grep -q 'function marketFlowVector' index.html
          ! grep -q 'void p.offsetWidth' index.html
          grep -q 'open:berlinZonedMs(p.year,p.month,p.day,8,0)' index.html
          grep -q 'close:berlinZonedMs(p.year,p.month,p.day,22,0)' index.html
          grep -q 'id="intrinsicToggle"' index.html
          grep -q "ivChart.update('none')" index.html
          ! grep -q 'hypeChart.destroy' index.html
          ! grep -q 'ivChart.destroy' index.html
          ! grep -q 'magChart.destroy' index.html
          grep -q 'Innerer Wert: exakte Berechnung' methodik.html
          grep -q 'Exakte SEC-Inputdatensätze' methodik.html
          grep -q 'TickerTick API' methodik.html
          grep -q 'ApeWisdom' methodik.html
          cmp -s index.html stockstrend.html

          node --check market-clock-core.js
          node --check price-shock-core.js

          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',html,re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/stockstrend-inline.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/stockstrend-inline.js

          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('methodik.html').read_text()
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',html,re.I)
          if not scripts:
              raise SystemExit('no methodology inline script found')
          Path('/tmp/methodik-inline.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/methodik-inline.js

          node - <<'NODE'
          const fs = require('fs');
          const names = [
            'stockstrend-data.json',
            'watchlist-data.json',
            'watchlist.json',
            'intrinsic-orcl.json',
            'orcl-minute.json',
            'eurusd-history.json',
            'orcl-history.json',
            'runtime-status.json'
          ];
          const data = Object.fromEntries(names.map(n => [n, JSON.parse(fs.readFileSync(n, 'utf8'))]));

          const watch = data['watchlist-data.json'];
          const trend = data['stockstrend-data.json'];
          const status = data['runtime-status.json'];
          if (!watch?.stocks?.ORCL) throw new Error('watchlist-data: ORCL missing');

          const fresh = Date.parse(status?.updated_at || '');
          if (!Number.isFinite(fresh)) throw new Error('runtime-status timestamp invalid');
          const ageMs = Date.now() - fresh;
          if (ageMs < -5*60*1000) {
            throw new Error('runtime snapshot timestamp is in the future: ageMs='+ageMs);
          }
          if (ageMs > 36*60*60*1000) {
            throw new Error('runtime snapshot too old even for last-known-good: ageMs='+ageMs);
          }
          if (ageMs > 15*60*1000) {
            console.log('Runtime snapshot is stale but valid last-known-good; UI must show its timestamp. ageMs='+ageMs);
          }
          if (watch.updated_at !== status.updated_at) throw new Error('watchlist/runtime timestamp mismatch');
          if (trend?.tick?.freshness?.freshest_absolute !== status.updated_at) throw new Error('trend/runtime freshness mismatch');
          if (!Number.isFinite(Number(watch?.stocks?.ORCL?.price)) || Number(watch.stocks.ORCL.price)<=0) {
            throw new Error('ORCL runtime price invalid');
          }

          const minute = data['orcl-minute.json'];
          const mr = minute?.chart?.result?.[0];
          const mts = mr?.timestamp || [];
          const mq = mr?.indicators?.quote?.[0] || {};
          const mgood = mts.filter((_, i) => Number.isFinite(Number(mq.close?.[i])) && Number(mq.close[i]) > 0);
          if (minute?.chart?.error || mgood.length < 25) {
            throw new Error('ORCL minute feed invalid/fewer than 25 valid bars');
          }

          const fx = data['eurusd-history.json'];
          const fr = fx?.chart?.result?.[0];
          const fts = fr?.timestamp || [];
          const fq = fr?.indicators?.quote?.[0] || {};
          const fgood = fts.filter((_, i) => Number.isFinite(Number(fq.close?.[i])) && Number(fq.close[i]) > 0);
          if (fx?.chart?.error || fgood.length < 500) {
            throw new Error('EURUSD history invalid/fewer than 500 valid bars');
          }

          const hist = data['orcl-history.json'];
          const hr = hist?.chart?.result?.[0];
          const hts = hr?.timestamp || [];
          const hq = hr?.indicators?.quote?.[0] || {};
          const hgood = hts.filter((_, i) => Number.isFinite(Number(hq.close?.[i])) && Number(hq.close[i]) > 0);
          if (hist?.chart?.error || hgood.length < 500) {
            throw new Error('ORCL daily history invalid/fewer than 500 valid bars');
          }
          const latestDailyTs = hts.length ? Math.max(...hts.map(Number).filter(Number.isFinite)) * 1000 : 0;
          if (!latestDailyTs || Date.now() - latestDailyTs > 7*864e5) {
            throw new Error('ORCL daily history stale');
          }

          const iv = data['intrinsic-orcl.json'];
          if (iv?.symbol !== 'ORCL' || !iv?.latest) throw new Error('intrinsic-orcl invalid');

          if (fs.existsSync('orcl-sentiment-history.json')) {
            const sh = JSON.parse(fs.readFileSync('orcl-sentiment-history.json','utf8'));
            if (sh.symbol !== 'ORCL' || !Array.isArray(sh.history) || !sh.history.length) {
              throw new Error('orcl-sentiment-history invalid');
            }
            const shFirst = Date.parse(sh.history[0]?.at || '');
            const shLast = Date.parse(sh.history.at(-1)?.at || '');
            if (!Number.isFinite(shFirst) || !Number.isFinite(shLast) || shLast < shFirst) {
              throw new Error('orcl-sentiment-history timestamps invalid');
            }
            if (sh.history.some(x => !Number.isFinite(Number(x.hype_bull)) || !Number.isFinite(Number(x.hype_bear)) || !Number.isFinite(Number(x.confidence)))) {
              throw new Error('orcl-sentiment-history contains invalid sentiment values');
            }
            console.log('Historical sentiment points', sh.history.length, sh.coverage || {});
          } else {
            console.log('Historical sentiment backfill not available yet; core runtime remains valid.');
          }

          console.log('Stockstrend validation OK', {
            updatedAt: status.updated_at,
            signal: status.derived?.signal,
            reddit: status.sources?.reddit,
            news: status.sources?.news,
            minuteBars: mgood.length,
            dailyBars: hgood.length,
            fxBars: fgood.length
          });
          NODE

      - name: Commit only complete validated runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add fresh-sources.json stockstrend-data.json watchlist-data.json watchlist.json \
            orcl-minute.json orcl-history.json orcl-sentiment-history.json eurusd-history.json \
            runtime-status.json microstructure-current.json

          if git diff --cached --quiet; then
            echo "Already current."
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run; refusing to overwrite newer state"
            exit 0
          fi

          git config user.name "stockstrend-runtime"
          git config user.email "stockstrend-runtime@users.noreply.github.com"
          git commit -m "Refresh ALANTU runtime data"
          git push origin HEAD:main
