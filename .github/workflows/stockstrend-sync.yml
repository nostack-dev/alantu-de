name: Keep Stockstrend current

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "stockstrend-data.json"
      - "watchlist-data.json"
      - "watchlist.json"
      - "orcl-minute.json"
      - "eurusd-history.json"
      - "runtime-status.json"
      - ".stockstrend-source-sha"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockstrend-runtime
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Resolve pinned UI upstream
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
            https://api.github.com/repos/nostack-dev/kurzlernen-de/commits/main | jq -r '.sha')"
          test -n "$SHA"
          test "$SHA" != "null"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Mirror exact Stockstrend UI source
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/nostack-dev/kurzlernen-de/$UPSTREAM_SHA"
          get() {
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 45 "$base/$1" -o "$2.tmp"
            test -s "$2.tmp"
            mv "$2.tmp" "$2"
          }

          get stockstrend.html index.html
          cp index.html stockstrend.html
          get market-clock-core.js market-clock-core.js
          get price-shock-core.js price-shock-core.js
          get intrinsic-orcl.json intrinsic-orcl.json
          printf '%s\n' "$UPSTREAM_SHA" > .stockstrend-source-sha

      - name: Prefer raw main fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old="""async function fetchJson(url,optional){
            try{var r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
            catch(e){if(optional)return null;throw e;}
          }"""
          new="""async function fetchJson(url,optional){
            var remote='https://raw.githubusercontent.com/nostack-dev/alantu-de/main/'+url+'?t='+Date.now();
            var local=url+'?t='+Date.now();
            var candidates=[remote,local];
            var lastErr=null;
            for(var i=0;i<candidates.length;i++){
              try{
                var r=await fetch(candidates[i],{cache:'no-store'});
                if(!r.ok)throw new Error('HTTP '+r.status);
                return await r.json();
              }catch(e){lastErr=e;}
            }
            if(optional)return null;
            throw lastErr||new Error('Daten nicht verfügbar');
          }"""
          for name in ("index.html","stockstrend.html"):
              p=Path(name)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f"fetchJson contract not found in {name}")
              p.write_text(s.replace(old,new))
          PY
          cmp -s index.html stockstrend.html

      - name: Refresh ORCL minute and EURUSD fallback feeds
        shell: bash
        run: |
          set -euo pipefail
          fetch_pair() {
            local url1="$1" url2="$2" out="$3"
            if ! curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$url1" -o "$out.tmp"; then
              curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$url2" -o "$out.tmp"
            fi
            test -s "$out.tmp"
            mv "$out.tmp" "$out"
          }

          fetch_pair \
            'https://query1.finance.yahoo.com/v8/finance/chart/ORCL?range=5d&interval=1m&includePrePost=true&events=div%2Csplits' \
            'https://query2.finance.yahoo.com/v8/finance/chart/ORCL?range=5d&interval=1m&includePrePost=true&events=div%2Csplits' \
            orcl-minute.json

          fetch_pair \
            'https://query1.finance.yahoo.com/v8/finance/chart/EURUSD=X?range=10y&interval=1d&includePrePost=false&events=div%2Csplits' \
            'https://query2.finance.yahoo.com/v8/finance/chart/EURUSD=X?range=10y&interval=1d&includePrePost=false&events=div%2Csplits' \
            eurusd-history.json

      - name: Build fresh fallback signal snapshot
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/refresh-runtime-data.mjs
          node tools/refresh-runtime-data.mjs

      - name: Verify browser live-source contract
        shell: bash
        run: |
          set -euo pipefail

          cors_ok() {
            local url="$1" out="$2"
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 \
              -H 'Origin: https://www.alantu.de' \
              -D "${out}.headers" "$url" -o "${out}.body" || return 1
            tr -d '\r' < "${out}.headers" | \
              grep -Eiq '^access-control-allow-origin:[[:space:]]*(\*|https://www\.alantu\.de)[[:space:]]*$'
          }

          primary=0
          tt='https://api.tickertick.com/feed?q=%28and%20tt%3Aorcl%20%28or%20T%3Acurated%20T%3Amarket%20T%3Aanalysis%20T%3Aindustry%20T%3Aearning%20T%3Asec%29%29&n=10'
          if cors_ok "$tt" /tmp/tickertick && jq -e '(.stories // []) | length > 0' /tmp/tickertick.body >/dev/null; then
            echo 'TickerTick browser CORS: OK'
            primary=1
          else
            echo 'TickerTick browser CORS unavailable; testing RSS fallback'
          fi

          feed='https://news.google.com/rss/search?q=Oracle%20ORCL%20stock%20when%3A1d&hl=en-US&gl=US&ceid=US%3Aen'
          encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$feed")"
          rss="https://api.rss2json.com/v1/api.json?rss_url=$encoded"
          fallback=0
          if cors_ok "$rss" /tmp/rss2json && jq -e '.status=="ok" and ((.items // []) | length > 0)' /tmp/rss2json.body >/dev/null; then
            echo 'RSS2JSON browser CORS fallback: OK'
            fallback=1
          fi

          if [ "$primary" -ne 1 ] && [ "$fallback" -ne 1 ]; then
            echo 'No browser-callable fresh news source available' >&2
            exit 1
          fi

      - name: Fail-closed validation
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'id="livePrice"' index.html
          grep -q 'id="marketClock"' index.html
          grep -q 'id="syncFooter"' index.html
          grep -q 'raw.githubusercontent.com/nostack-dev/alantu-de/main/' index.html
          grep -q "fetchJson('stockstrend-data.json'" index.html
          grep -q "fetchJson('watchlist-data.json'" index.html
          grep -q "fetchJson('intrinsic-orcl.json'" index.html
          grep -q "fetchJson('eurusd-history.json'" index.html
          grep -q 'fetchTickerTick' index.html
          grep -q 'refreshFreshSignals' index.html
          grep -q 'lastBrowserSyncAt=s.at' index.html
          grep -q 'TickerTick UGC' index.html
          cmp -s index.html stockstrend.html

          node --check market-clock-core.js
          node --check price-shock-core.js

          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',html,re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/stockstrend-inline.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/stockstrend-inline.js

          node - <<'NODE'
          const fs = require('fs');
          const names = [
            'stockstrend-data.json',
            'watchlist-data.json',
            'watchlist.json',
            'intrinsic-orcl.json',
            'orcl-minute.json',
            'eurusd-history.json',
            'runtime-status.json'
          ];
          const data = Object.fromEntries(names.map(n => [n, JSON.parse(fs.readFileSync(n, 'utf8'))]));

          const watch = data['watchlist-data.json'];
          const trend = data['stockstrend-data.json'];
          const status = data['runtime-status.json'];
          if (!watch?.stocks?.ORCL) throw new Error('watchlist-data: ORCL missing');

          const fresh = Date.parse(status?.updated_at || '');
          if (!Number.isFinite(fresh)) throw new Error('runtime-status timestamp invalid');
          const ageMs = Date.now() - fresh;
          if (ageMs < -5*60*1000 || ageMs > 15*60*1000) {
            throw new Error('runtime snapshot not fresh: ageMs='+ageMs);
          }
          if (watch.updated_at !== status.updated_at) throw new Error('watchlist/runtime timestamp mismatch');
          if (trend?.tick?.freshness?.freshest_absolute !== status.updated_at) throw new Error('trend/runtime freshness mismatch');
          if (!Number.isFinite(Number(watch?.stocks?.ORCL?.price)) || Number(watch.stocks.ORCL.price)<=0) {
            throw new Error('ORCL runtime price invalid');
          }

          const minute = data['orcl-minute.json'];
          const mr = minute?.chart?.result?.[0];
          const mts = mr?.timestamp || [];
          const mq = mr?.indicators?.quote?.[0] || {};
          const mgood = mts.filter((_, i) => Number.isFinite(Number(mq.close?.[i])) && Number(mq.close[i]) > 0);
          if (minute?.chart?.error || mgood.length < 25) {
            throw new Error('ORCL minute feed invalid/fewer than 25 valid bars');
          }

          const fx = data['eurusd-history.json'];
          const fr = fx?.chart?.result?.[0];
          const fts = fr?.timestamp || [];
          const fq = fr?.indicators?.quote?.[0] || {};
          const fgood = fts.filter((_, i) => Number.isFinite(Number(fq.close?.[i])) && Number(fq.close[i]) > 0);
          if (fx?.chart?.error || fgood.length < 500) {
            throw new Error('EURUSD history invalid/fewer than 500 valid bars');
          }

          const iv = data['intrinsic-orcl.json'];
          if (iv?.symbol !== 'ORCL' || !iv?.latest) throw new Error('intrinsic-orcl invalid');

          console.log('Stockstrend validation OK', {
            updatedAt: status.updated_at,
            signal: status.derived?.signal,
            reddit: status.sources?.reddit,
            news: status.sources?.news,
            minuteBars: mgood.length,
            fxBars: fgood.length
          });
          NODE

      - name: Commit only complete validated fallback snapshot
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git add index.html stockstrend.html market-clock-core.js price-shock-core.js \
            stockstrend-data.json watchlist-data.json watchlist.json intrinsic-orcl.json \
            orcl-minute.json eurusd-history.json runtime-status.json .stockstrend-source-sha

          if git diff --cached --quiet; then
            echo "Already current."
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run; refusing to overwrite newer state"
            exit 0
          fi

          git config user.name "stockstrend-runtime"
          git config user.email "stockstrend-runtime@users.noreply.github.com"
          git commit -m "Refresh Stockstrend runtime data ${UPSTREAM_SHA:0:12}"
          git push origin HEAD:main
