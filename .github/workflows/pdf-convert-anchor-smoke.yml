name: Unlimited OCR searchable PDF smoke

on:
  push:
    branches: ["main"]
    paths:
      - "pdf-convert-anchor.html"
      - "alantu-unlimited-ocr.js"
      - "tools/pdf-convert-anchor-smoke.mjs"
      - ".github/workflows/pdf-convert-anchor-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  unlimited-ocr-pdf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Mark searchable PDF smoke pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/$SHA \
            -d '{"state":"pending","context":"unlimited-ocr-pdf-smoke","description":"Checking live Unlimited-OCR searchable PDF"}'

      - name: Guard Unlimited-OCR browser source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'alantu-unlimited-ocr.js' pdf-convert-anchor.html
          grep -q '@wllama/wllama@3.6.1' alantu-unlimited-ocr.js
          grep -q 'Unlimited-OCR-Q5_K_S.gguf' alantu-unlimited-ocr.js
          grep -q 'mmproj-Unlimited-OCR-F16.gguf' alantu-unlimited-ocr.js
          grep -q 'buildSearchablePdf' alantu-unlimited-ocr.js
          grep -q '<|grounding|>OCR this image.' alantu-unlimited-ocr.js
          grep -q 'buildMergedSvg' alantu-unlimited-ocr.js

      - name: Wait for live Unlimited-OCR converter
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 20 "https://www.alantu.de/pdf-convert-anchor.html?smoke=${{ github.sha }}" -o /tmp/pdf-convert-live.html \
              && curl -fsSL --max-time 20 "https://www.alantu.de/alantu-unlimited-ocr.js?smoke=${{ github.sha }}" -o /tmp/unlimited-live.js \
              && grep -q 'alantu-unlimited-ocr.js' /tmp/pdf-convert-live.html \
              && grep -q '@wllama/wllama@3.6.1' /tmp/unlimited-live.js \
              && grep -q 'Unlimited-OCR-Q5_K_S.gguf' /tmp/unlimited-live.js \
              && grep -q 'buildSearchablePdf' /tmp/unlimited-live.js; then
              exit 0
            fi
            sleep 10
          done
          echo "Live Unlimited-OCR converter did not reach current main" >&2
          exit 1

      - name: Check Unlimited-OCR model and runtime endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSIL --max-time 30 "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/esm/index.js" >/dev/null
          curl -fsSIL --max-time 30 "https://huggingface.co/sahilchachra/Unlimited-OCR-GGUF/resolve/main/Unlimited-OCR-Q5_K_S.gguf?download=true" >/dev/null
          curl -fsSIL --max-time 30 "https://huggingface.co/sahilchachra/Unlimited-OCR-GGUF/resolve/main/mmproj-Unlimited-OCR-F16.gguf?download=true" >/dev/null

      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 pdf-lib@1.17.1 pdfjs-dist@2.16.105
          npx playwright install --with-deps chromium

      - name: Run searchable PDF browser smoke
        env:
          PDF_CONVERT_URL: https://www.alantu.de/pdf-convert-anchor.html
          PDF_SAMPLE: assets/sunside-living-expose.pdf
        run: node tools/pdf-convert-anchor-smoke.mjs

      - name: Publish searchable PDF smoke result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Unlimited-OCR searchable PDF live smoke passed"
          else
            state=failure
            description="Unlimited-OCR searchable PDF smoke failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/$SHA \
            -d "{\"state\":\"$state\",\"context\":\"unlimited-ocr-pdf-smoke\",\"description\":\"$description\"}"
