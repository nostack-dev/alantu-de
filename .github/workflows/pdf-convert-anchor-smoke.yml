name: Unlimited OCR searchable PDF smoke

on:
  push:
    branches: ["main"]
    paths:
      - "pdf-convert-anchor.html"
      - "alantu-unlimited-ocr.js"
      - "vendor/unlimited-ocr-browser-engine.js"
      - "tools/pdf-convert-anchor-smoke.mjs"
      - ".github/workflows/pdf-convert-anchor-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pages: write

jobs:
  unlimited-ocr-pdf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Guard source
        run: |
          set -euo pipefail
          grep -q 'alantu-unlimited-ocr.js?v=browser-webgpu-17' pdf-convert-anchor.html
          grep -q 'from "./vendor/unlimited-ocr-browser-engine.js"' alantu-unlimited-ocr.js
          grep -q 'function fetchWithRetry' alantu-unlimited-ocr.js
          grep -q 'withHeartbeat' alantu-unlimited-ocr.js
          grep -q 'diagnoseLocalOcrBottleneck' alantu-unlimited-ocr.js
          grep -q 'runSmallFallbackOcr' alantu-unlimited-ocr.js
          grep -q 'makeFallbackOcrCanvas' alantu-unlimited-ocr.js
          grep -q 'releasePrimaryOcrResources' alantu-unlimited-ocr.js
          grep -q 'FALLBACK_LONG_EDGE=1600' alantu-unlimited-ocr.js
          grep -q 'decoderTransport:"HTTP Range → GPU buffers"' alantu-unlimited-ocr.js
          grep -q 'primaryOcrDisabledReason' alantu-unlimited-ocr.js
          grep -q 'mBottleneck' alantu-unlimited-ocr.js
          grep -q 'id="mBottleneck"' pdf-convert-anchor.html
          grep -q 'forceFallbackOcr' alantu-unlimited-ocr.js
          grep -q 'tesseract.js@5.1.1' alantu-unlimited-ocr.js
          grep -q 'Fallback-OCR auf' alantu-unlimited-ocr.js
          grep -q 'data-role="visible-vector-text"' alantu-unlimited-ocr.js
          grep -q 'data-baked-diff="1"' alantu-unlimited-ocr.js
          grep -q 'buildVectorPdf' alantu-unlimited-ocr.js
          grep -q 'renderVectorSvgLayer' alantu-unlimited-ocr.js
          grep -q 'native-text-vector' alantu-unlimited-ocr.js
          grep -q 'window.__alantuVectorContract' alantu-unlimited-ocr.js
          grep -q 'afterVectorSvg' pdf-convert-anchor.html
          grep -q 'NakliTechie/gemma4-webgpu@0ca5e3a' alantu-unlimited-ocr.js
          grep -q 'Unlimited-OCR-DeepEncoder-ONNX' alantu-unlimited-ocr.js
          grep -q 'beginRingDecode(pos+1)' alantu-unlimited-ocr.js
          test -s vendor/unlimited-ocr-browser-engine.js
          ! grep -q '@wllama/wllama' alantu-unlimited-ocr.js
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          cat /tmp/pages.json || true
          test "$code" = "201" -o "$code" = "202"
      - name: Wait for current runtime live
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 20 "https://www.alantu.de/pdf-convert-anchor.html?smoke=${{ github.sha }}" -o /tmp/page.html \
              && curl -fsSL --max-time 20 "https://www.alantu.de/alantu-unlimited-ocr.js?smoke=${{ github.sha }}" -o /tmp/uocr.js \
              && curl -fsSL --max-time 20 "https://www.alantu.de/vendor/unlimited-ocr-browser-engine.js?smoke=${{ github.sha }}" -o /tmp/engine.js \
              && grep -q 'alantu-unlimited-ocr.js?v=browser-webgpu-17' /tmp/page.html \
              && grep -q 'function fetchWithRetry' /tmp/uocr.js \
              && grep -q 'withHeartbeat' /tmp/uocr.js \
              && grep -q 'diagnoseLocalOcrBottleneck' /tmp/uocr.js \
              && grep -q 'runSmallFallbackOcr' /tmp/uocr.js \
              && grep -q 'makeFallbackOcrCanvas' /tmp/uocr.js \
              && grep -q 'releasePrimaryOcrResources' /tmp/uocr.js \
              && grep -q 'FALLBACK_LONG_EDGE=1600' /tmp/uocr.js \
              && grep -q 'decoderTransport:"HTTP Range → GPU buffers"' /tmp/uocr.js \
              && grep -q 'primaryOcrDisabledReason' /tmp/uocr.js \
              && grep -q 'mBottleneck' /tmp/uocr.js \
              && grep -q 'id="mBottleneck"' /tmp/page.html \
              && grep -q 'forceFallbackOcr' /tmp/uocr.js \
              && grep -q 'tesseract.js@5.1.1' /tmp/uocr.js \
              && grep -q 'Fallback-OCR auf' /tmp/uocr.js \
              && grep -q 'data-role="visible-vector-text"' /tmp/uocr.js \
              && grep -q 'data-baked-diff="1"' /tmp/uocr.js \
              && grep -q 'buildVectorPdf' /tmp/uocr.js \
              && grep -q 'renderVectorSvgLayer' /tmp/uocr.js \
              && grep -q 'native-text-vector' /tmp/uocr.js \
              && grep -q 'window.__alantuVectorContract' /tmp/uocr.js \
              && grep -q 'afterVectorSvg' /tmp/page.html \
              && grep -q 'createGemmaEngine' /tmp/engine.js \
              && ! grep -q '@wllama/wllama' /tmp/uocr.js; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 pdf-lib@1.17.1 pdfjs-dist@2.16.105
          npx playwright install --with-deps chromium
      - name: Run PDF UI/export smoke
        env:
          PDF_CONVERT_URL: https://www.alantu.de/pdf-convert-anchor.html
        run: node tools/pdf-convert-anchor-smoke.mjs