name: Unlimited OCR searchable PDF smoke

on:
  push:
    branches: ["main"]
    paths:
      - "pdf-convert-anchor.html"
      - "alantu-unlimited-ocr.js"
      - "tools/pdf-convert-anchor-smoke.mjs"
      - ".github/workflows/pdf-convert-anchor-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  unlimited-ocr-pdf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Mark smoke pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${{ github.repository }}/statuses/$SHA             -d '{"state":"pending","context":"unlimited-ocr-pdf-smoke","description":"Checking browser-native Unlimited-OCR PDF flow"}'

      - name: Guard browser-native Unlimited-OCR source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'alantu-unlimited-ocr.js?v=browser-webgpu-2' pdf-convert-anchor.html
          grep -q 'from "./vendor/unlimited-ocr-browser-engine.js"' alantu-unlimited-ocr.js
          grep -q 'Unlimited-OCR-DeepEncoder-ONNX' alantu-unlimited-ocr.js
          grep -q 'Unlimited-OCR-Q4_K_M.gguf' alantu-unlimited-ocr.js
          grep -q 'onnxruntime-web@1.26.0' alantu-unlimited-ocr.js
          grep -q 'PROMPT_IDS=\[34030,76466,16\]' alantu-unlimited-ocr.js
          grep -q 'beginRingDecode(pos+1)' alantu-unlimited-ocr.js
          grep -q 'function parseNpz' alantu-unlimited-ocr.js
          grep -q 'buildSearchablePdf' alantu-unlimited-ocr.js
          grep -q 'mImageTextPercent' alantu-unlimited-ocr.js
          test -s vendor/unlimited-ocr-browser-engine.js
          ! grep -q '@wllama/wllama' alantu-unlimited-ocr.js
          ! grep -q 'loadModelFromHF' alantu-unlimited-ocr.js
          ! grep -q 'https://esm.sh/gh/' alantu-unlimited-ocr.js

      - name: Wait for current runtime live
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 20 "https://www.alantu.de/pdf-convert-anchor.html?smoke=${{ github.sha }}" -o /tmp/page.html               && curl -fsSL --max-time 20 "https://www.alantu.de/alantu-unlimited-ocr.js?smoke=${{ github.sha }}" -o /tmp/uocr.js               && grep -q 'alantu-unlimited-ocr.js?v=browser-webgpu-1' /tmp/page.html               && grep -q 'NakliTechie/gemma4-webgpu@0ca5e3a129200ac84b3c3098311a88949ea4ca0e' /tmp/uocr.js               && grep -q 'Unlimited-OCR-DeepEncoder-ONNX' /tmp/uocr.js               && grep -q 'beginRingDecode(pos+1)' /tmp/uocr.js               && ! grep -q '@wllama/wllama' /tmp/uocr.js; then
              exit 0
            fi
            sleep 10
          done
          echo "Current browser-native Unlimited-OCR runtime is not live" >&2
          exit 1

      - name: Check browser runtime endpoints
        shell: bash
        run: |
          set -euo pipefail
          check_range() {
            local url="$1"
            for attempt in 1 2 3 4; do
              code=$(curl -L -sS --retry 2 --retry-all-errors --max-time 45 \
                -H "Range: bytes=0-1023" -o /tmp/endpoint.bin -w "%{http_code}" "$url" || true)
              if [ "$code" = "200" ] || [ "$code" = "206" ]; then
                test -s /tmp/endpoint.bin
                return 0
              fi
              echo "endpoint attempt $attempt failed: HTTP $code $url" >&2
              sleep $((attempt * 2))
            done
            return 1
          }
          check_range "https://www.alantu.de/vendor/unlimited-ocr-browser-engine.js"
          check_range "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.26.0/dist/ort.webgpu.min.mjs"
          check_range "https://huggingface.co/sahilchachra/Unlimited-OCR-GGUF/resolve/main/Unlimited-OCR-Q4_K_M.gguf"
          check_range "https://huggingface.co/naklitechie/Unlimited-OCR-DeepEncoder-ONNX/resolve/main/deepencoder_fp32.onnx"
          check_range "https://huggingface.co/naklitechie/Unlimited-OCR-DeepEncoder-ONNX/resolve/main/deepencoder_extras.npz"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 pdf-lib@1.17.1 pdfjs-dist@2.16.105
          npx playwright install --with-deps chromium

      - name: Run PDF UI/export smoke with deterministic OCR fixture
        env:
          PDF_CONVERT_URL: https://www.alantu.de/pdf-convert-anchor.html
        run: node tools/pdf-convert-anchor-smoke.mjs

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Browser-native Unlimited-OCR PDF smoke passed"
          else
            state=failure
            description="Browser-native Unlimited-OCR PDF smoke failed"
          fi
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${{ github.repository }}/statuses/$SHA             -d "{\"state\":\"$state\",\"context\":\"unlimited-ocr-pdf-smoke\",\"description\":\"$description\"}"
