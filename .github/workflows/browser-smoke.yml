name: Browser smoke

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "stockstrend.html"
      - "tools/browser-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current Pages content
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 15 https://www.alantu.de/ -o /tmp/alantu-live.html \
              && grep -Fq 'function priceScrubOverlayPlugin()' /tmp/alantu-live.html \
              && grep -Fq 'function projectionZonePlugin()' /tmp/alantu-live.html \
              && grep -Fq "function chartEvents(){return ['click','touchstart','touchmove'];}" /tmp/alantu-live.html \
              && grep -Fq 'var cut=Date.now()-14*864e5,firstKeep=0' /tmp/alantu-live.html \
              && grep -Fq 'if(bv>0&&t-bt<=36*3600000)return bv;' /tmp/alantu-live.html \
              && grep -Fq 'data-price-range="1m"' /tmp/alantu-live.html \
              && grep -Fq 'data-price-range="year"' /tmp/alantu-live.html \
              && grep -Fq 'data-price-range="5y"' /tmp/alantu-live.html \
              && grep -Fq 'data-price-range="all"' /tmp/alantu-live.html; then
              exit 0
            fi
            sleep 10
          done
          echo "Current ALANTU page did not expose the current chart-range build in time" >&2
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Desktop and mobile console/render smoke
        env:
          SMOKE_URL: https://www.alantu.de/
          SMOKE_OUT: /tmp/alantu-browser-smoke
        run: node tools/browser-smoke.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alantu-browser-smoke
          path: /tmp/alantu-browser-smoke/*.png
          if-no-files-found: ignore
