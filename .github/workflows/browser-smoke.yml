name: Browser smoke

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "stockstrend.html"
      - "tools/browser-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alantu-browser-smoke-main
  cancel-in-progress: false

jobs:
  live-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact current Pages content
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -fsSL --max-time 15 "https://www.alantu.de/?_=${GITHUB_SHA}" -o /tmp/alantu-live.html \
              && cmp -s index.html /tmp/alantu-live.html; then
              echo "Live HTML exactly matches checkout."
              exit 0
            fi
            sleep 10
          done
          echo "Live ALANTU HTML did not converge to this checkout." >&2
          sha256sum index.html /tmp/alantu-live.html 2>/dev/null || true
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Desktop and mobile console/render smoke
        env:
          SMOKE_URL: https://www.alantu.de/
          SMOKE_OUT: /tmp/alantu-browser-smoke
        run: node tools/browser-smoke.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alantu-browser-smoke
          path: /tmp/alantu-browser-smoke/*.png
          if-no-files-found: ignore
