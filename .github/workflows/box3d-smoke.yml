# hinge-angle-diagnostic: 1790149552107
on:
  push:
    paths:
      - ".github/workflows/box3d-smoke.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify Box3D runtime
        run: |
          python3 -m http.server 4173 >/tmp/alantu-http.log 2>&1 &
          cat > box3d-smoke.mjs <<'JS'
          import { chromium } from "playwright";

          const browser=await chromium.launch({headless:true});
          const failures=[];

          function watch(page,label){
            page.on("pageerror",err=>failures.push(`${label}: pageerror: ${err.message}`));
          }

          async function assertPhysics(page,label){
            await page.waitForFunction(
              ()=>document.querySelector(".stage")?.dataset?.physics==="box3d-0.2.0",
              null,{timeout:30000}
            );
            const resources=await page.evaluate(()=>performance.getEntriesByType("resource").map(x=>x.name));
            if(!resources.some(x=>x.includes("alantu-book-core-box3d020.js"))){
              failures.push(`${label}: immutable core not loaded`);
            }
            if(!resources.some(x=>x.includes("alantu-book-physics-box3d020.js"))){
              failures.push(`${label}: immutable physics not loaded`);
            }
          }

          async function makePdf20(){
            const p=await browser.newPage({viewport:{width:900,height:1200}});
            let html='<style>@page{size:A4;margin:0}body{margin:0}section{height:1122px;padding:90px;box-sizing:border-box;page-break-after:always;background:#f4f0e8;color:#171713;font-family:Arial}h1{font:64px Georgia;margin-top:220px}</style>';
            for(let i=1;i<=20;i++)html+=`<section><h1>ALANTU Blatt ${i}</h1><p>Seite ${i} / 20</p></section>`;
            await p.setContent(html);
            await p.pdf({path:"/tmp/alantu-20.pdf",format:"A4",printBackground:true});
            await p.close();
          }

          async function nextAndWait(page,target,label){
            await page.evaluate(()=>document.querySelector("#nextBtn")?.click());
            try{
              await page.waitForFunction(
                target=>document.querySelector("#pageCount")?.textContent?.trim()===target,
                target,{timeout:8000}
              );
            }catch(error){
              const debug=await page.evaluate(()=>({
                pageCount:document.querySelector("#pageCount")?.textContent?.trim(),
                physics:document.querySelector(".stage")?.dataset?.physics,
                state:window.__alantuBookCore?.state?.(),
                p0:window.__alantuBookCore?.physics?.getLeafProgress?.(0),
                p1:window.__alantuBookCore?.physics?.getLeafProgress?.(1),
                settled0:window.__alantuBookCore?.physics?.isLeafSettled?.(0,1)
              }));
              throw new Error(`${label} target ${target} timeout; debug=${JSON.stringify(debug)}`);
            }
          }

          // MAIN
          {
            const page=await browser.newPage({viewport:{width:1600,height:1100}});
            watch(page,"main");
            await page.goto("http://127.0.0.1:4173/index-brand.html?box3dSmoke=1",{waitUntil:"networkidle"});
            await assertPhysics(page,"main");

            // Exercise all three physical leaves.
            for(const target of ["02–03 / 06","04–05 / 06","06 / 06"]){
              await nextAndWait(page,target,"main");
            }
            await page.evaluate(()=>document.querySelector("#nextBtn")?.click());
            await page.waitForFunction(()=>document.querySelector("#nextBtn")?.disabled===true,null,{timeout:8000});
            await page.close();
          }

          await makePdf20();

          // PDF / 10 leaves
          {
            const page=await browser.newPage({viewport:{width:1600,height:1100}});
            watch(page,"pdf");
            await page.goto("http://127.0.0.1:4173/pdf-to-exposee.html?box3dSmoke=1",{waitUntil:"networkidle"});
            await assertPhysics(page,"pdf");
            await page.locator("#pdfInput").setInputFiles("/tmp/alantu-20.pdf");
            await page.waitForFunction(()=>document.querySelector("#status")?.textContent?.includes("Seiten bereit"),null,{timeout:45000});

            const targets=[
              "02–03 / 20","04–05 / 20","06–07 / 20","08–09 / 20","10–11 / 20",
              "12–13 / 20","14–15 / 20","16–17 / 20","18–19 / 20","20 / 20"
            ];
            for(const target of targets)await nextAndWait(page,target,"main");

            await page.evaluate(()=>document.querySelector("#nextBtn")?.click());
            await page.waitForFunction(()=>document.querySelector("#nextBtn")?.disabled===true,null,{timeout:8000});
            await page.close();
          }

          await browser.close();

          if(failures.length){
            throw new Error(failures.join("\n"));
          }
          JS
          node box3d-smoke.mjs
