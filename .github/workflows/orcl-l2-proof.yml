name: Prove ORCL 100-event L2 model

on:
  push:
    branches: ["main"]
    paths:
      - "tools/databento-orcl-mbp10-backfill.py"
      - "tools/databento-orcl-cost.py"
      - "tools/train-orcl-l2-100.py"
      - "tools/l2-event-signal.mjs"
      - "tools/test-l2-event-signal.mjs"
      - "tools/test_l2_feature_parity.py"
      - "tools/dump-l2-feature-fixture.mjs"
      - "tools/l2_temporal_features.py"
      - "tools/databento-orcl-mbp10-live.py"
      - "tools/finalize-l2-model.mjs"
      - ".github/workflows/orcl-l2-proof.yml"
  schedule:
    - cron: "35 22 * * 1-5"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Depth dataset"
        required: true
        default: "XNAS.ITCH"
        type: choice
        options:
          - MEMX.MEMOIR
          - XNAS.ITCH
      start:
        description: "Historical start YYYY-MM-DD"
        required: true
      end:
        description: "Historical end YYYY-MM-DD"
        required: true

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    outputs:
      databento_configured: ${{ steps.credential.outputs.configured }}
    env:
      DATABENTO_API_KEY_PRESENT: ${{ secrets.DATABENTO_API_KEY != '' }}
    steps:
      - name: Report provider credential state
        id: credential
        shell: bash
        run: |
          echo "DATABENTO_CONFIGURED=$DATABENTO_API_KEY_PRESENT"
          echo "configured=$DATABENTO_API_KEY_PRESENT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - run: |
          python -m py_compile tools/databento-orcl-mbp10-backfill.py tools/databento-orcl-cost.py tools/train-orcl-l2-100.py tools/databento-orcl-mbp10-live.py tools/l2_temporal_features.py tools/test_l2_feature_parity.py
          node --check tools/l2-event-signal.mjs
          node --check tools/finalize-l2-model.mjs
          node --check tools/dump-l2-feature-fixture.mjs
          node tools/test-l2-event-signal.mjs
          python -m pip install --disable-pip-version-check --quiet numpy
          node tools/dump-l2-feature-fixture.mjs > /tmp/l2-js-feature.json
          python tools/test_l2_feature_parity.py /tmp/l2-js-feature.json

  prove:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.syntax.outputs.databento_configured == 'true' }}
    needs: syntax
    runs-on: ubuntu-latest
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      L2_DATASET: ${{ github.event_name == 'workflow_dispatch' && inputs.dataset || 'XNAS.ITCH' }}
      L2_OUT_DIR: orcl-l2-days
      L2_COST_OUT: orcl-l2-cost.json
      L2_MAX_COST_USD: "125"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve chronological proof window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "L2_START=${{ inputs.start }}" >> "$GITHUB_ENV"
            echo "L2_END=${{ inputs.end }}" >> "$GITHUB_ENV"
          else
            echo "L2_START=$(date -u -d '430 days ago' +%F)" >> "$GITHUB_ENV"
            echo "L2_END=$(date -u +%F)" >> "$GITHUB_ENV"
          fi
      - name: Require real provider credential
        run: test -n "$DATABENTO_API_KEY"
      - name: Install exact data runtime
        run: python -m pip install --disable-pip-version-check --quiet databento pandas numpy
      - name: Preflight exact historical cost
        run: python tools/databento-orcl-cost.py
      - name: Download and normalize real ORCL MBP-10
        run: python tools/databento-orcl-mbp10-backfill.py
      - name: Train fixed 100-event model
        run: python tools/train-orcl-l2-100.py orcl-l2-days orcl-l2-model.json orcl-l2-proof.json
      - name: Finalize canonical model identity
        run: node tools/finalize-l2-model.mjs orcl-l2-model.json
      - name: Enforce long-form evidence if validated
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg dataset "$L2_DATASET" '.symbol=="ORCL" and .dataset==$dataset and .schema=="mbp-10" and .feature_version=="hdr-dt-v1" and .horizon_events==100 and (.feature_names|length==24)' orcl-l2-model.json >/dev/null
          if [ "$(jq -r '.status' orcl-l2-model.json)" = "validated" ]; then
            jq -e '
              (.evidence.usable_days>=252)
              and (.evidence.holdout_signals>=500)
              and (.evidence.holdout_days>=60)
              and (.evidence.holdout.hit95[0]>0.5)
              and (.evidence.holdout.mean_net_bps>0.5)
              and (.evidence.holdout.median_net_bps>0)
              and (.evidence.holdout.mean_net_bps95[0]>0)
              and (.evidence.regimes.low_vol.mean_net_bps>0)
              and (.evidence.regimes.high_vol.mean_net_bps>0)
            ' orcl-l2-model.json >/dev/null
            test "$(jq -r '.model_id|length' orcl-l2-model.json)" -eq 16
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: orcl-l2-100-proof-${{ github.run_id }}
          path: |
            orcl-l2-model.json
            orcl-l2-proof.json
            orcl-l2-days/manifest.json
            orcl-l2-cost.json
          retention-days: 90
      - name: Stage publication payload
        shell: bash
        run: |
          cp orcl-l2-model.json /tmp/orcl-l2-model.json
          cp orcl-l2-proof.json /tmp/orcl-l2-proof.json
          jq '{
            status:.status,
            symbol:.symbol,
            dataset:.dataset,
            schema:.schema,
            feature_version:.feature_version,
            horizon_events:.horizon_events,
            model_id:.model_id,
            evidence:.evidence,
            updated_at:(now|todate)
          }' /tmp/orcl-l2-model.json > /tmp/orcl-l2-proof-status.json
      - name: Publish proof result fail-closed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/orcl-l2-proof-status.json orcl-l2-proof-status.json
          if [ "$(jq -r '.status' /tmp/orcl-l2-model.json)" = "validated" ]; then
            cp /tmp/orcl-l2-model.json orcl-l2-model.json
          fi
          git add orcl-l2-proof-status.json orcl-l2-model.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "orcl-l2-validator"
          git config user.email "orcl-l2-validator@users.noreply.github.com"
          git commit -m "Publish ORCL 100E L2 proof result"
          git push origin HEAD:main
