name: Publish Exposee to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index-brand.html"
      - "pdf-to-exposee.html"
      - "pdf-to-exposee-anchor.html"
      - "pdf-convert-anchor.html"
      - "alantu-unlimited-ocr.js"
      - "vendor/unlimited-ocr-browser-engine.js"
      - "alantu-book-core.js"
      - "alantu-book-view.js"
      - ".github/workflows/exposee-pages-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  rebuild-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          cat /tmp/pages.json || true
          test "$code" = "201" -o "$code" = "202"
      - name: Wait for current public files
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            ok=1
            curl -fsSL --max-time 20 "https://www.alantu.de/index-brand.html?deploy=${{ github.sha }}" -o /tmp/index-brand-live.html || ok=0
            curl -fsSL --max-time 20 "https://www.alantu.de/pdf-to-exposee.html?deploy=${{ github.sha }}" -o /tmp/pdf-live.html || ok=0
            curl -fsSL --max-time 20 "https://www.alantu.de/alantu-book-core.js?deploy=${{ github.sha }}" -o /tmp/core-live.js || ok=0
            curl -fsSL --max-time 20 "https://www.alantu.de/pdf-convert-anchor.html?deploy=${{ github.sha }}" -o /tmp/convert-live.html || ok=0
            curl -fsSL --max-time 20 "https://www.alantu.de/alantu-unlimited-ocr.js?deploy=${{ github.sha }}" -o /tmp/uocr-live.js || ok=0
            curl -fsSL --max-time 20 "https://www.alantu.de/vendor/unlimited-ocr-browser-engine.js?deploy=${{ github.sha }}" -o /tmp/engine-live.js || ok=0
            if [ "$ok" = "1" ] \
              && grep -q 'touch-action:none;' /tmp/index-brand-live.html \
              && grep -q 'touch-action:none;' /tmp/pdf-live.html \
              && grep -q 'pointerdown",pointerDown,{passive:false}' /tmp/core-live.js \
              && grep -q 'lostpointercapture' /tmp/core-live.js \
              && grep -q 'alantu-unlimited-ocr.js?v=browser-webgpu-17' /tmp/convert-live.html \
              && grep -q 'function fetchWithRetry' /tmp/uocr-live.js \
              && grep -q 'withHeartbeat' /tmp/uocr-live.js \
              && grep -q 'diagnoseLocalOcrBottleneck' /tmp/uocr-live.js \
              && grep -q 'runSmallFallbackOcr' /tmp/uocr-live.js \
              && grep -q 'makeFallbackOcrCanvas' /tmp/uocr-live.js \
              && grep -q 'releasePrimaryOcrResources' /tmp/uocr-live.js \
              && grep -q 'FALLBACK_LONG_EDGE=1600' /tmp/uocr-live.js \
              && grep -q 'decoderTransport:"HTTP Range → GPU buffers"' /tmp/uocr-live.js \
              && grep -q 'primaryOcrDisabledReason' /tmp/uocr-live.js \
              && grep -q 'mBottleneck' /tmp/uocr-live.js \
              && grep -q 'id="mBottleneck"' /tmp/convert-live.html \
              && grep -q 'forceFallbackOcr' /tmp/uocr-live.js \
              && grep -q 'tesseract.js@5.1.1' /tmp/uocr-live.js \
              && grep -q 'Fallback-OCR auf' /tmp/uocr-live.js \
              && grep -q 'data-role="visible-vector-text"' /tmp/uocr-live.js \
              && grep -q 'data-baked-diff="1"' /tmp/uocr-live.js \
              && grep -q 'buildVectorPdf' /tmp/uocr-live.js \
              && grep -q 'renderVectorSvgLayer' /tmp/uocr-live.js \
              && grep -q 'native-text-vector' /tmp/uocr-live.js \
              && grep -q 'window.__alantuVectorContract' /tmp/uocr-live.js \
              && grep -q 'afterVectorSvg' /tmp/convert-live.html \
              && grep -q 'NakliTechie/gemma4-webgpu@0ca5e3a' /tmp/uocr-live.js \
              && grep -q 'createGemmaEngine' /tmp/engine-live.js \
              && ! grep -q '@wllama/wllama' /tmp/uocr-live.js; then
              exit 0
            fi
            sleep 10
          done
          exit 1