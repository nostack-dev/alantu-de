name: Publish Exposee to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index-brand.html"
      - "pdf-to-exposee.html"
      - "pdf-to-exposee-anchor.html"
      - "alantu-book-core.js"
      - "alantu-book-view.js"
      - ".github/workflows/exposee-pages-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  rebuild-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          cat /tmp/pages.json || true
          if [ "$code" != "201" ]; then
            echo "Pages rebuild request failed with HTTP $code" >&2
            exit 1
          fi

      - name: Wait for current Exposee files live
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            ok=1
            curl -fsSL --max-time 20 "https://www.alantu.de/index-brand.html?deploy=${{ github.sha }}" -o /tmp/index-brand-live.html || ok=0
            curl -fsSL --max-time 20 "https://www.alantu.de/pdf-to-exposee.html?deploy=${{ github.sha }}" -o /tmp/pdf-live.html || ok=0
            curl -fsSL --max-time 20 "https://www.alantu.de/alantu-book-core.js?deploy=${{ github.sha }}" -o /tmp/core-live.js || ok=0
            if [ "$ok" = "1" ]               && grep -q 'touch-action:none;' /tmp/index-brand-live.html               && grep -q 'touch-action:none;' /tmp/pdf-live.html               && grep -q 'pointerdown",pointerDown,{passive:false}' /tmp/core-live.js               && grep -q 'lostpointercapture' /tmp/core-live.js; then
              echo "Current Exposee touch fix is live."
              exit 0
            fi
            sleep 10
          done
          echo "Pages rebuilt but current Exposee files did not appear on www.alantu.de." >&2
          exit 1
